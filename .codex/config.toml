# Project-local registration; review and trust this exact hook in Codex before use.
# Default-off unless Codex inherits RT_CODEX_DEV_AUTOSTART=1.
[[hooks.SessionStart]]
matcher = "^(startup|resume)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'node "$(git rev-parse --show-toplevel)/.codex/hooks/start-dev.cjs"'
timeout = 15
statusMessage = "Checking opt-in Randomtrip worktree startup"
