# Netlify Configuration for Next.js 14
# Minimal configuration - Netlify handles most defaults automatically

[build.environment]
  # Node.js version
  NODE_VERSION = "20"
  
  # Ensure devDependencies are installed (required for Prisma)
  NPM_CONFIG_PRODUCTION = "false"
  
  # Set NODE_ENV to production
  NODE_ENV = "production"

# Next.js plugin - Required for Next.js support on Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Lighthouse audit on every deploy. Thresholds below are a starting point, NOT
# strict gates yet — we have no baseline. Tune these once we've seen a few
# real reports from the deployed (SSR) site.
[[plugins]]
  package = "@netlify/plugin-lighthouse"

  [plugins.inputs]
    output_path = "reports/lighthouse.html"

    [plugins.inputs.thresholds]
      performance = 0.8
      accessibility = 0.9
      best-practices = 0.9
      seo = 0.9

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

