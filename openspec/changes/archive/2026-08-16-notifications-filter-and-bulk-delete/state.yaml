  - artifact: design
    date: 2026-08-07
    note: >
      Design written against the real code (read ExperiencesPageClient,
      BlogPageClient, RoleNotificationsPageClient, all 3 notification API
      routes, DashboardUnreadDot, StrictDashboardLayout/DashboardRoleShell/
      DashboardNavTabs, ui/Pagination, ui/Select, the 3 role server pages, the
      3 pass-through clients, and the just-finished spec). Nine numbered ADRs.
      Load-bearing decisions: (D1) a new shared
      src/lib/notifications/list-query.ts owns the Prisma where + status/
      audience parsers + toClientNotification, imported by BOTH
      GET /api/notifications and the 3 server pages, because those 3 pages
      already duplicate the row->ClientNotification map verbatim and a filter
      that must agree between SSR and client fetch cannot survive 4 copies.
      (D2) deliberate deviation from experiences/blog: notifications KEEP their
      SSR seed (initialNotifications + initialTotal + initialUnreadTotal +
      initialPage + initialStatus) and skip the mount fetch via a hydratedRef,
      instead of the pure client-fetch + LoadingSpinner shape, since the page
      renders server-side today and a spinner on every visit is a UX
      regression. (D3) server pages honour page/status from searchParams but
      the client does NOT push state back to the URL (experiences/blog have no
      URL sync either; accepted consequence: URL goes stale after filtering).
      (D4) keep the <ul>/<li> feed rather than converting to <table>: the
      pattern being matched is the interaction pattern, not the table element;
      checkbox becomes the first flex child of the existing
      `flex items-start gap-4` row and select-all moves into a gray-50 header
      strip standing in for the missing <thead>; rounded-t/b-xl drop off rows
      in favour of overflow-hidden on the panel, and `index` leaves the .map().
      Real gotcha found and documented: the row div already carries
      onClick=markRead plus an Enter/Space onKeyDown when clickToMarkRead is
      true, so the new checkbox REQUIRES stopPropagation on both onClick and
      onKeyDown or ticking a box also marks the row read (and under the Unread
      filter the row vanishes mid-selection). (D5) DELETE uses
      deleteMany({ where: { id, userId } }) — one atomic statement, count===0
      means "missing or not yours" -> 404 (not 403, which would confirm another
      user's id exists), 200 { success: true } (not 204, since every route here
      answers via NextResponse.json and a 204 cannot carry a body); a bare
      delete() cannot express the ownership filter and throws P2025 instead of
      returning a status. (D6) read-all mirrors unread-count's param PARSING
      but returns 400 on missing/invalid audience instead of copying its
      `?? "TRIPPER"` fallback — silently defaulting a WRITE would let an admin
      with a dropped param mark their TRIPPER rows read while the admin dot
      stays lit. (D7) unread-dot freshness = a 12-line module-level pub/sub
      singleton at src/lib/notifications/unreadDotBus.ts, NOT lifted state and
      NOT a Context provider: DashboardUnreadDot is a SIBLING of the page
      (StrictDashboardLayout renders <DashboardRoleShell/> then {children}), so
      lifting would require turning the shared async server layout into a
      client boundary wrapping every dashboard page for all 3 roles; both
      components are client components in the same module graph, so a typed
      singleton is the smallest correct channel, published from all three
      mutation paths and consumed by a useCallback refresh in the dot.
      (D8) GET also returns unreadTotal (a 3rd count) so the global
      "Mark all read" button cannot hide itself when page 1 happens to be
      all-read while unread rows sit on page 3. (D9) latent bug fixed in
      passing: route.ts:21 whitelists only TRAVELER/TRIPPER, so
      ?audience=ADMIN silently drops the audience filter and returns every
      audience. Two proposal claims re-verified this phase rather than trusted:
      the dead NotificationsPanel/NotificationsList/NotificationItem stack has
      zero external importers (only mutual imports), and
      prisma/schema.prisma:590-606 already has isRead +
      @@index([userId, isRead]) + @@index([userId, createdAt]) so there is
      genuinely NO schema diff. Also discovered that after the dead stack is
      deleted the rearchitected client becomes the ONLY consumer of
      GET /api/notifications, so its contract can be redefined with no
      back-compat shim. 15 new dict keys specified with both en and es values,
      extending the existing notifications section (flat emptyState /
      emptyStateTitle left untouched; emptyStateFiltered added as a sibling to
      avoid churning unrelated call sites); common.pagination reused, not added.
      A short "Spec reconciliation" section records the two places the design
      refines the spec's wording ("checkbox column" in a <ul>; "clicks anywhere
      on the row" excluding the checkbox control) so sdd-verify does not read
      them as violations. Slice ordering restated as a hard constraint: A
      (shared module + 3 routes) precedes B (client + pages + copy); C (bus +
      dead-code deletion) is independent of both. Exceeds the design skill's
      800-word budget, accepted deliberately and for the same reason the
      proposal did: the brief asked 8 specific technical questions requiring
      exact route handlers, exact state shape and exact JSX, and compressing
      them would push those decisions back onto sdd-apply.
