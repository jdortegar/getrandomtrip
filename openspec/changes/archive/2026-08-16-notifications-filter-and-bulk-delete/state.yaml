  - artifact: proposal
    date: 2026-08-07
    note: >
      Proposal written from a finalized grill-me design interview — all 11
      decisions were resolved live against the code with file/line citations,
      so no open questions remain. Ask was "dropdown filter (All/Unread/Read)
      + row-select + bulk-delete on the notifications pages for all three
      roles, same as other tables"; research showed the three role pages are
      ~10-line pass-throughs into ONE shared component
      (src/components/app/dashboard/shared/RoleNotificationsPageClient.tsx,
      227 lines) whose only role variance is resolveHref + audience, so the
      whole feature is written once. Key finding driving scope: notifications
      have none of the plumbing the experiences/blog pattern assumes — the
      server pages call prisma.notification.findMany directly with no query
      params and no pagination, and src/app/api/notifications/ contains only
      route.ts (GET), unread-count/route.ts (GET) and [id]/read/route.ts
      (PATCH), i.e. NO DELETE endpoint exists at all. User explicitly chose
      full rearchitecture (page/limit/status params + client-fetch + shared
      ui/Pagination.tsx) over a lightweight in-memory filter, and explicitly
      chose per-id DELETE under Promise.allSettled over a batch endpoint to
      match both live precedents (ExperiencesPageClient, BlogPageClient — no
      bulk DELETE collection route exists for either). Deliberately NOT
      copied from blog: the isBlogRowLockedForDeletion locked-row guard, which
      exists only because blog review copies reference parentId with no
      FK/cascade — notifications are self-contained, so every row is always
      deletable. "Mark all read" stays GLOBAL for behavior parity despite the
      new pagination, which forces a second new endpoint
      (PATCH /api/notifications/read-all) since the current
      N-parallel-PATCH-per-visible-id approach stops covering "everything".
      Two extras pulled in by explicit user choice: deleting the confirmed-dead
      NotificationsPanel/NotificationsList/NotificationItem stack (grep: zero
      importers outside each other), and fixing the pre-existing
      DashboardUnreadDot.tsx mount-only staleness, bundled because the latent
      single-click bug and the new bulk-action case share one root cause.
      Out of scope: search box, locked rows, cross-page select-all, type/
      audience filtering, and ANY schema change (no readAt, no soft delete —
      hard delete only, so there is no migration and rollback is code-only).
      Capabilities contract: new `notifications-management`; modified
      `dashboard-shell` (the existing unread-dot requirement at
      openspec/specs/dashboard-shell/spec.md:54-68 constrains the dot's source
      but not its freshness). Size flagged as High 400-line budget risk
      (3 API surfaces + a 227-line component rearchitecture + a cross-component
      freshness mechanism + dual-locale copy) with a suggested 3-slice boundary
      (A: API layer, B: client rearchitecture, C: unread-dot + dead code) and a
      hard ordering constraint that A precedes B; delivery_strategy=ask-on-risk
      so the chaining decision belongs to the user after sdd-tasks. Exceeds the
      propose skill's 450-word soft budget, accepted deliberately per the
      precedent set by tripper-profile-visibility's proposal in this repo — the
      brief was a finalized decision record with 11 cited decisions plus an
      exhaustive current-state audit, and compressing it would drop the
      file/line evidence downstream phases depend on.
