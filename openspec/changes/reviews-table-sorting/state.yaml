  - artifact: design
    date: 2026-08-07
    note: >
      CORRECTION (supersedes the null-placement portion of the design revision
      below) — user decided to relax to Postgres' NATIVE null placement rather
      than build the ~80-line workaround. "Randomtrip" (tripperId: null) reviews
      land LAST on ascending and FIRST on descending, and that is now the
      accepted correct behavior, not a compromise. REMOVED from the design: the
      entire src/lib/db/review-sort-query.ts module
      (paginateTripperNullsLast — partitioned named-tripper / null-tripper
      pagination with skip/take repagination across the boundary, query/count
      injected as callbacks), its dedicated test file plan
      (src/lib/db/__tests__/review-sort-query.test.ts), and the admin route's
      second branch. The tripper-name sort is now plain
      orderBy: [{ tripper: { name: sortOrder } }, { createdAt: "desc" },
      { id: "asc" }] — identical in shape to traveler (user.name), rating, and
      created — so reviewListOrderBy in src/lib/reviews/sort.ts is the ONLY sort
      logic in the change: one findMany, one orderBy, no special-casing, no
      extra query, no branch. The admin route's where / select / skip / take /
      count and its rawReviews -> tripperName mapping (route.ts:74-78) are all
      untouched. The underlying Prisma finding is unchanged and still
      load-bearing for anyone revisiting this: nested relation orderBy IS
      supported (index.d.ts:22332) but nulls placement is NOT reachable through
      it (:21208 types UserOrderByWithRelationInput.name as plain SortOrder
      because User.name is non-nullable at schema.prisma:23), which is exactly
      why native placement was the only cheap option. Review workload: this
      deletes the module that was pushing the change from Medium toward High
      400-line risk, so it sits back at MEDIUM (2 new files — one pure module,
      one small UI primitive — 5 modified files, dual-locale copy, 3 test
      files); tasks.md has not been written yet, so it forecasts against the
      reduced shape from the start rather than inheriting a High estimate. One
      test scenario was ADDED to compensate for the deleted module's coverage:
      the pure sort test now asserts the tripper case carries no nulls key AND
      no tripperId filter, so a future "fix" that filters nulls out cannot
      silently drop Randomtrip rows; manual QA now checks last-on-asc /
      first-on-desc plus unchanged row count. Verified that sdd-spec had already
      amended spec.md:124-140 to two direction-specific scenarios in parallel,
      so design and spec now agree and the design's earlier
      "spec amendment required" open question is closed — nothing left for
      sdd-verify to reconcile on null placement.
  - artifact: spec
    date: 2026-08-07
    note: >
      Correction to the "Null Placement for Tripper-Name Sort" requirement.
      Design found that Prisma's nulls:"last" modifier does not apply to this
      shape — User.name (the tripper relation's sorted field) is non-nullable,
      so NullsOrder is only reachable on the nullable scalar (tripperId), not
      on the relation's name field — and that forcing "nulls always last
      regardless of direction" required a bespoke workaround
      (review-sort-query.ts: partitioned named-tripper/null-tripper pagination
      across a skip/take boundary, ~80 lines, 2 extra queries, its own test),
      pushing this from Medium to High risk for one edge case on one of four
      sort fields. User accepted Postgres' native null-placement behavior
      instead (nulls sort as "greatest" by default): ascending places
      tripperId: null ("Randomtrip") rows LAST, descending places them FIRST.
      This is now the correct, accepted behavior, not a flagged gap. Replaced
      the single "always last regardless of direction" scenario with two
      explicit scenarios (ascending -> Randomtrip last; descending ->
      Randomtrip first) in
      specs/reviews-list-sorting/spec.md. Downstream effect: the
      review-sort-query.ts workaround and its route branch, described in the
      design revision below, are no longer required by the spec and should be
      dropped in a design/tasks follow-up.
  - artifact: design
    date: 2026-08-07
    note: >
      Design resolved all 7 deferred technical questions against the real code,
      not assumptions. Param convention: sortBy (rating|created|traveler|tripper)
      + sortOrder (asc|desc), tokens deliberately decoupled from schema column
      names. ONE shared pure module src/lib/reviews/sort.ts holds the token
      vocabulary, both per-surface whitelists, REVIEW_SORT_DEFAULT, never-throw
      parsers, and reviewListOrderBy — chosen over two local maps because the
      exact precedent exists in src/lib/notifications/list-query.ts from last
      night's change (parseNotificationStatus: never-throw parser + one shared
      builder used by both route and query layer), and because a whitelist is a
      security control worth one test target, unlike the prior filter/search
      change's 3-line where spread. KEY VERIFIED FINDING (read the generated
      client, did not assume): Prisma 7.4.1 DOES support nested relation sorts —
      node_modules/.prisma/client/index.d.ts:22332 exposes
      ReviewOrderByWithRelationInput.user / .tripper as
      UserOrderByWithRelationInput — BUT nulls placement is NOT available on
      them, because :21208 types UserOrderByWithRelationInput.name as plain
      SortOrder (not SortOrderInput | SortOrder) since User.name is
      non-nullable at schema.prisma:23. NullsOrder exists (:20887) but is
      reachable only on nullable scalars (tripperId, :22343). Postgres therefore
      sorts NULL as greatest → nulls last on asc, nulls FIRST on desc, which
      CONTRADICTS the spec requirement "nulls last regardless of direction"
      (spec.md:124-140, written in parallel by sdd-spec). Resolved
      spec-compliant via a new src/lib/db/review-sort-query.ts exporting
      paginateTripperNullsLast: partitions into a named-tripper group
      (tripperId: { not: null }, ordered by tripper.name) followed by the
      tripperId: null group, with skip/take math across the boundary; takes
      query/count as callbacks so the admin route keeps its own select and stays
      typed; only sortBy=tripper takes this branch; prisma.review.count({ where })
      total is untouched so pagination stays correct. Rejected $queryRaw (would
      duplicate the whole status+insensitive-search where as SQL, need two manual
      joins, discard the typed select) and rejected
      [{ tripperId: { sort, nulls: "last" } }, { tripper: { name } }] (type-legal
      but makes an opaque cuid the primary sort key, destroying name order). Side
      benefit: the explicit tripperId: { not: null } filter ELIMINATES proposal
      risk #5 (Prisma relation join dropping null rows) rather than just testing
      for it. Flagged as the one open question: if the reviewer accepts Postgres'
      native placement (Randomtrip last on asc, first on desc), amending that
      single spec requirement deletes review-sort-query.ts + its test + the route
      branch, about 80 lines off the diff. Also decided: deterministic
      tiebreakers on every sort ({ createdAt: desc } then { id: asc }; created
      sort gets { id: asc } only) because tied ORDER BY under skip/take silently
      duplicates and drops rows across pages — this is a deliberate superset of
      today's single { createdAt: desc } and must not be read as a regression.
      getTripperReviews stays additive: options gains sortBy?: TripperReviewSortBy
      and sortOrder?: ReviewSortOrder, both defaulted from REVIEW_SORT_DEFAULT so
      omitting them reproduces today's order; the reviewListOrderBy switch's
      default branch is a second whitelist gate for callers bypassing the route.
      Default sort state (question 3) solved with ONE shared constant
      REVIEW_SORT_DEFAULT imported by BOTH client components and BOTH server
      paths, with clients always sending both params explicitly — client and
      server cannot drift and no round trip is needed to discover the current
      sort. UI: one new shared primitive src/components/ui/SortButton.tsx
      (lucide ArrowUpDown inactive / ArrowUp asc / ArrowDown desc at h-3.5 w-3.5,
      inactive arrow kept VISIBLE at text-neutral-300 rather than
      opacity-hidden, per the design-system rule against opacity as an
      off-state; active arrow text-light-blue; button carries the
      text-[11px] font-semibold uppercase tracking-wider header type). Tripper
      page gets an inline strip (no new local component) between the existing h3
      panel header and the <ul>, styled as the design-system table header row
      (bg-gray-50 border-b border-gray-200 px-5 py-3) with role="group" +
      aria-pressed per button — deliberately NOT aria-sort, which is only valid
      on columnheader. Admin's 4 sortable <th> drop their text classes (SortButton
      carries them), keep px-5 py-3 text-left, and gain aria-sort
      ascending/descending/none; the 4 non-sortable <th> (review, status, tripId,
      actions) stay byte-identical. Sort state is NOT extracted into a shared
      hook (question 6): the prior filter/search change left statusFilter /
      searchQuery / debouncedSearch / updateStatusFilter / clearFilters duplicated
      in both clients, and a hook owning sortBy+sortOrder but not
      page/status/search would split one fetch's state across two owners — extract
      only when the whole query state moves together. First-click direction per
      field via REVIEW_SORT_INITIAL_ORDER: rating/created → desc, traveler/tripper
      → asc. Testing (strict TDD): new pure src/lib/reviews/__tests__/sort.test.ts
      (exact orderBy per token including relation nesting; invalid sortBy falls
      back to created while a VALID sortOrder is still honored; garbage sortOrder
      → desc; containment assertion that no emitted key falls outside
      {rating, createdAt, user, tripper, id} so future edits can't widen the
      whitelist; every result ends with a tiebreaker); extend the existing
      src/lib/db/__tests__/tripper-queries.getTripperReviews.test.ts (same prisma
      mock, currently asserts only where); new
      src/lib/db/__tests__/review-sort-query.test.ts with injected fakes covering
      null placement in BOTH directions plus the three pagination-boundary cases;
      new client tests per the RoleNotificationsPageClient.test.tsx precedent
      (first fetch URL carries sortBy=created&sortOrder=desc with zero extra
      requests, toggle flips direction, combined sort+status=approved+search=Ana
      on page 3 resets to page=1 keeping all three, exactly 4 buttons in thead).
      No DB-backed test infra exists (every lib test mocks prisma), so true
      SQL-level null ordering is a manual QA line, honestly labeled as such.
