  - artifact: proposal
    date: 2026-08-07
    note: >
      Proposal written from a finalized grill-me design interview — all 9
      decisions were resolved live against the code with file/line citations,
      so no open questions remain. Ask was "add sorting to the reviews tables
      (tripper's own reviews page and admin reviews page) for rating, status,
      created, and the ones that make more sense", following tonight's
      notifications-filter-and-bulk-delete change and a reviews filter+search
      change. Key finding driving scope: NO sorting convention exists anywhere
      in this codebase — zero sortBy/sortOrder/sortDirection/SortableHeader
      matches under src/components/app/dashboard/ or src/app/api/, all 16
      orderBy occurrences across API routes are hardcoded literals, and no
      clickable sort header exists on any table (RecentPaymentsTable,
      ExperiencesPageClient, TravelerTripsTable, AdminPaymentsPageClient,
      AdminExperiencesPageClient, AdminBlogPageClient all checked). This
      change therefore SETS the first sort precedent: query-param naming,
      icon language, and whitelist validation chosen here are what the next
      table will copy. Second key finding: the two surfaces have different
      markup shapes — the tripper page
      (src/components/app/dashboard/tripper/reviews/ReviewsPageClient.tsx) is
      a card/list <ul><li> with NO header row at all, while the admin page
      (src/app/[locale]/(secure)/dashboard/admin/AdminReviewsPageClient.tsx)
      is a real 8-column <table>. User explicitly chose (after two
      clarification rounds) to RETROFIT a clickable header row above the
      tripper card list rather than use a dropdown sort control or skip the
      tripper page. Sortable fields finalized per surface: tripper = rating +
      created only (the page is already scoped to one tripper via
      where: { tripperId }, so tripper-name sort is meaningless); admin =
      rating + created + traveler name (user.name) + tripper name
      (tripper.name, nullable relation). status/isApproved was in the user's
      original ask but was DROPPED after the interview surfaced that a
      filter dropdown (All/Approved/Unapproved) already expresses exactly
      that distinction, there is zero precedent for sorting a boolean
      anywhere in the app, and a 2-value sort is really "group X first" — a
      filter concern. review (title/content) and tripId are explicitly NOT
      sortable (free text and an opaque cuid have no natural order) and are
      recorded as non-goals so sdd-verify does not read their absence as a
      gap. Two accuracy decisions worth carrying forward: (a) "Created" must
      render as ACTIVELY sorted descending on first load, not neutral, since
      both pages genuinely ARE createdAt desc today (hardcoded at
      src/lib/db/tripper-queries.ts:874 and
      src/app/api/admin/reviews/route.ts:46) and a neutral header would
      misrepresent ordered data; (b) sorting MUST be server-side via Prisma
      orderBy driven by query params — both pages are server-paginated, so
      client-side re-sorting would reorder only the current page and produce
      a wrong global order. Hard technical constraint. Whitelist validation
      of the sort field is a security requirement, not hygiene: never pass a
      raw client string into a dynamic orderBy key. Verified the prior
      change's base signature exists in the working tree:
      getTripperReviews(tripperId, { page, limit, status?, search? }) at
      tripper-queries.ts:846-864 — extending it with sortBy?/sortOrder? is
      additive, not breaking. Verified no existing spec under openspec/specs/
      constrains reviews ordering (the only ordering requirement anywhere is
      05-traveler-dashboard.md:54, about notifications), so Capabilities is
      new `reviews-list-sorting` with Modified: None. Size flagged as Medium
      400-line budget risk — materially smaller than
      notifications-filter-and-bulk-delete (no new endpoints, no mutations,
      no schema change, no data-flow inversion, both read paths already
      opened up by tonight's change) but touching 2 UIs, 2 query paths, a new
      shared sort-header component, and dual-locale copy under strict TDD.
      Suggested 2-slice boundary if chaining is chosen: A (data layer — param
      convention + both whitelists + relation/null ordering) precedes B (UI —
      shared sort header, both surfaces, copy). Flagged as a hard
      prerequisite that tonight's reviews filter+search change is present but
      UNCOMMITTED, so apply must not run against a reverted or partially
      landed base. Open design questions deliberately deferred: exact query
      param names, exact lucide icon choice, null placement for tripper-name
      sort (tripperId: null rows display as "Randomtrip"), and whether the
      two whitelists share one helper with per-surface allowed sets or stay
      two local maps.
