scope_guardrail: >-
  Deliberately small, single-PR change per explicit user decision ("Single PR
  (Recommended)"): one Prisma model, one API route, one email template, one
  modal, plus dictionary entries. Do NOT scope-creep into a message-history UI,
  rate limiting, or an audit-log viewer — all explicitly declined in the
  interview ("write-only for now").
