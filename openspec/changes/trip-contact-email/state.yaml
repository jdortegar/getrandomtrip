verified_facts:
  date: 2026-08-11
  notes:
    - "TripFulfillmentHeader.tsx:70-73 confirmed: <a href={`mailto:${trip.user.email}`}>
       with styles.backLink, lucide `Mail` icon, copy.contactTraveler label."
    - "AdminTripUser (src/lib/admin/types.ts:21-25) is exactly { email, id, name } —
       NO `locale` field. Traveler locale must be resolved SERVER-SIDE in the route
       from prisma.user, never passed from the client."
    - "resolveLocale (src/lib/email/index.ts:72-74) is module-PRIVATE (not exported).
       The new send function should live in that same module to reuse it, or the
       helper must be exported — design decision, no new behavior."
    - "All 23 existing send* functions use the `void (async () => { try/catch } )()`
       fire-and-forget shape (e.g. sendBookingConfirmed, index.ts:76-121). The new
       function deliberately breaks this pattern: it must be awaitable and throw."
    - "sendMail (src/lib/helpers/sendMail.ts) accepts replyTo, and THROWS on Resend
       error (`throw new Error(error.message)`) and on a missing RESEND_API_KEY. The
       route's try/catch is what produces the FAILED audit row."
    - "AdminNewBooking.tsx pattern confirmed: named `subject` export (single-locale)
       or `subjects` (es/en map, used by every traveler-facing template) + default
       component wrapping EmailLayout with inline React.CSSProperties style objects."
    - "Trip-scoped child-record convention confirmed at schema.prisma:195
       (TripDocument) and :325 (Payment): `tripRequest TripRequest @relation(fields:
       [tripRequestId], references: [id], onDelete: Cascade)` plus an @@index and
       an @@map to a snake_case table name."
    - "TripDocument.uploadedById is `String?` with onDelete: SetNull and the doc
       comment 'Audit metadata ONLY — MUST NOT be read as an authorization input'.
       This is the precedent for the new model's sending-admin FK."
    - "User.email is non-nullable (`String @unique`, schema.prisma:22), so the
       sending admin always has an address for replyTo — no fallback fork."
    - "requireAdmin() (src/lib/admin/requireAdmin.ts) returns
       { ok: true, adminId } | { ok: false, errorResponse } with 401/403 already
       built, and uses hasRoleAccess(caller, 'admin') over User.roles[] — never
       role === 'ADMIN'."
    - "src/app/api/admin/trip-requests/[id]/route.ts already exists, so adding a
       /contact subroute is structurally consistent."
    - "Modal.tsx, FormField.tsx, TextAreaInput.tsx all confirmed present in
       src/components/ui/."
    - "openspec/specs/ currently holds: experience, blog-review-flow,
       auth-verification, admin-dashboard-overview, dashboard-shell, tripper,
       trip-request-lifecycle. There is NO trip-fulfillment-documents capability
       spec promoted yet (that change is at status: apply, archive pending) — its
       spec still lives under openspec/changes/trip-fulfillment-documents/specs/."
capabilities:
  new:
    - admin-traveler-messaging
  modified:
