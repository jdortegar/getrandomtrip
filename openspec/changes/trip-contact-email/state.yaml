resolved_decisions:
  - id: 1
    status: final
    summary: Branded via existing EmailLayout wrapper, same shell as all other transactional email.
  - id: 2
    status: final
    summary: >-
      Rendered in resolveLocale(trip.user.locale) — the traveler's own stored
      preference, like sendBookingConfirmed. NOT the admin's dashboard locale.
      Requires a server-side user lookup since AdminTripUser carries no locale.
  - id: 3
    status: final
    summary: >-
      Plain text only, rendered as paragraphs split on newlines. No rich text
      editor, no HTML input from the admin — avoids all sanitization work.
      Compose field is the existing TextAreaInput primitive.
  - id: 4
    status: final
    summary: >-
      Modal opens with BOTH subject and body prefilled and localized (greeting
      uses trip.user.name, sign-off from "the GetRandomTrip team"). Admin edits
      before sending; nothing blank by default.
  - id: 5
    status: final
    summary: >-
      sendMail's replyTo is the sending admin's own email (looked up via
      session/adminId), not a shared inbox — mirrors the mailto: behavior being
      replaced so the traveler's reply goes straight back to the author.
  - id: 6
    status: final
    summary: >-
      Send is awaited inside the route so the modal can show a real
      success/failure result. Deliberate divergence from the 23 existing
      fire-and-forget send* functions, which are triggered by background system
      events with nobody watching.
  - id: 7
    status: final
    summary: >-
      NEW Prisma model TripContactMessage required — write-only audit row per
      send attempt (subject, body, sending admin, status SENT|FAILED, optional
      error, createdAt, tripRequestId FK with onDelete: Cascade). No GET
      endpoint, no history list, no admin-facing viewer in this change; read by
      direct DB query only for later support/dispute lookups.
  - id: 8
    status: final
    summary: >-
      No status restriction — the button/modal is available on every
      TripRequest.status (DRAFT, CANCELLED, etc.), identical to the mailto: link
      it replaces. Do not add any gating rule.
  - id: 9
    status: final
    summary: >-
      Audit row denormalizes the sending admin's email as a plain adminEmail
      string captured at send time, IN ADDITION to the adminId FK (onDelete:
      SetNull, matching TripDocument.uploadedById). Resolves design_notes #1 —
      the record must stay fully readable for support/dispute lookups even
      after the admin account is deleted.
  - id: 10
    status: final
    summary: >-
      REVERSES design.md's Open Question #1 recommendation. Prefilled
      subject/body is built in the TRAVELER's locale, not the admin's
      dashboard locale, so it matches the EmailLayout shell (Decision #2) by
      default. Requires: AdminTripUser gains `locale: string | null`; both
      admin trip-request GET routes add `locale: true` to their existing
      prisma.user select. Purely additive to a shared type — no existing
      consumer breaks.
