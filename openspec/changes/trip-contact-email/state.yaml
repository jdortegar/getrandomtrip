revisions:
  - artifact: proposal
    date: 2026-08-11
    note: >
      Initial proposal. All eight product forks arrived pre-resolved from a
      /grill-me interview and are recorded as FINAL Resolved Decisions #1-#8;
      the proposal's Open Questions section is empty by design.

      Every claim was verified by direct file read before writing (see
      verified_facts). Three findings sharpen the downstream phases beyond what
      the interview supplied: (a) AdminTripUser has no `locale` field, so
      Resolved Decision #2's traveler-locale resolution is necessarily a
      server-side prisma.user lookup in the route, not a prop passed down from
      the header; (b) resolveLocale is module-private in src/lib/email/index.ts,
      so the new awaitable send function should co-locate in that module rather
      than export the helper; (c) sendMail throws both on Resend error and on a
      missing RESEND_API_KEY, which is precisely the mechanism that yields the
      status: FAILED audit row Resolved Decision #7 requires — no extra error
      plumbing needed.

      One genuinely new implementation-detail fork surfaced that the interview
      did not cover and that is NOT a product question: the sending-admin FK
      shape on the audit model (SetNull-nullable per the
      TripDocument.uploadedById precedent vs. additionally denormalizing the
      admin email so the audit survives user deletion). Recorded under
      design_notes, not open_questions.
  - artifact: spec
    date: 2026-08-11
    note: >
      Wrote two delta specs per the proposal's Capabilities section. New full
      spec for admin-traveler-messaging (7 requirements, 18 scenarios)
      expressing Resolved Decisions #1-9 as testable MUST/scenario pairs:
      compose-and-send with prefilled localized plain-text content, awaitable
      synchronous send with a real success/failure result, replyTo to the
      sending admin, server-side traveler-locale resolution, write-only
      TripContactMessage audit row on every attempt (SENT/FAILED + error +
      denormalized adminEmail per decision #9, cascade delete with
      TripRequest), requireAdmin() 401/403 guard, and no status restriction.

      MODIFIED delta for admin-dashboard-overview: copied the full
      "Dedicated Trip-Request Fulfillment Page Replaces the Modal"
      requirement block from the not-yet-archived trip-fulfillment-documents
      change delta (main openspec/specs/admin-dashboard-overview/spec.md has
      no mailto-related requirement yet, per verified_facts), edited the
      mailto references to describe the modal-button behavior, and added one
      new scenario for the button-opens-modal behavior while preserving all
      prior scenarios intact.

      No product-level ambiguity encountered — all spec content traces
      directly to a Resolved Decision or a verified_fact in the proposal.
  - artifact: design
    date: 2026-08-11
    note: >
      Wrote design.md with 4 ADRs, the exact Prisma model, function/route/modal
      contracts, and RED test sequencing. Every referenced file was read
      directly before writing (schema.prisma:20-200/318-330, email/index.ts:1-140,
      AdminNewBooking.tsx, TripCancelled.tsx, EmailLayout.tsx, sendMail.ts,
      requireAdmin.ts, trip-documents/route.ts, UserRoleModal.tsx,
      FormField.tsx, TextAreaInput.tsx, interpolateTemplate.ts,
      TripFulfillmentHeader.tsx, AdminTripFulfillmentPageClient.tsx,
      dictionary.ts:1610-1667, and both existing test files).

      Resolved design_notes #1 exactly as Resolved Decision #9 dictates:
      adminId String? + SetNull + the TripDocument.uploadedById audit doc
      comment, PLUS a non-null denormalized adminEmail captured at send time.

      ADR-1: sendAdminTripContactMessage co-locates in src/lib/email/index.ts
      to reuse module-private resolveLocale, and takes ALREADY-RESOLVED
      traveler/admin data instead of IDs (unlike the 23 sibling send*
      functions) because the route must load both anyway for its 404 check and
      for the decision-#9 denormalization — passing IDs would duplicate both
      queries and force a prisma mock into the send function's unit test.

      ADR-2: modal open/close state is LIFTED to
      AdminTripFulfillmentPageClient; TripFulfillmentHeader stays presentational
      and only gains an onContactTraveler callback. This matches how every
      other trip-fulfillment child (TripDocumentsTable, AddTripDocumentForm,
      TripDangerZone) receives callbacks from the page, and keeps Radix Dialog
      portals out of the header's existing createRoot-based test.

      ADR-3: newline→paragraph splitting is an exported pure `toParagraphs`
      helper in the template file, and compose prefill/canSend logic lives in
      contactTravelerModalHelpers.ts — the userRoleModalHelpers.ts +
      __tests__/userRoleModalHelpers.test.ts precedent, so both are RED-testable
      without rendering react-email or Radix in jsdom.

      ADR-4: a failed send returns 502 { error: "send_failed" } rather than a
      200 envelope, so the modal reuses the existing body.error →
      fulfillmentDict.errors[key] mapping already used by handleAddDocument.

      Concrete numbers picked and justified: subject 1-200 chars, body 1-4000
      chars, enforced identically server-side and as the modal's maxLength
      props. NOTE for apply: TextAreaInput defaults to maxLength 280, so the
      4000 must be passed explicitly or the body silently truncates.

      Dictionary decision: extend the existing AdminTripFulfillmentDict with a
      nested contactModal object plus errors.send_failed, rather than a sibling
      top-level section — the header's contactTraveler label already lives
      there and the page already slices fulfillmentDict to it. Email template
      copy stays in the template's locale-keyed copy const (the convention for
      all 23 templates, explicitly permitted by
      .claude/rules/i18n-and-types.md's locale-keyed-map clause).

      Two non-blocking items flagged in design.md Open Questions, both with a
      stated recommendation and neither reopening a Resolved Decision:
      (a) the prefill is necessarily built in the ADMIN's dashboard locale
      (AdminTripUser carries no locale) while the EmailLayout shell renders in
      the TRAVELER's locale per decision #2, so a Spanish-writing admin can
      send Spanish body text inside an English shell — recommend accepting for
      this single-PR change; (b) an audit-write failure after a successful send
      still returns 200, per the proposal's own "log loudly" risk mitigation.
  - artifact: tasks
    date: 2026-08-11
    note: >
      Wrote tasks.md with 7 dependency-ordered phases (26 tasks): schema/types
      foundation, email template + awaitable send function, API route,
      dictionary (es+en same task per i18n-and-types.md), modal + helpers,
      header/page wiring, verification. Strict TDD RED-before-GREEN pairing
      applied to every testable unit per design.md's stated RED order
      (toParagraphs/subjects, sendAdminTripContactMessage, route handler,
      contactTravelerModalHelpers, TripFulfillmentHeader).

      Review Workload Forecast: estimated ~730-760 changed lines across ~10
      new files plus their RED tests and 8 modified files — High risk against
      the 400-line budget, driven by file count, not scope creep (the
      scope_guardrail's single model/route/template/modal footprint holds).
      delivery_strategy is locked to single-pr (explicit user decision, not
      re-litigated), so Chained PRs recommended is set to No and Chain
      strategy is size-exception; Decision needed before apply is Yes per the
      single-pr guard mapping — sdd-apply must record size:exception before
      starting, not split into chained PRs.
