repo_rules_binding:
  - .claude/rules/i18n-and-types.md — every new user-visible string needs es AND
    en dictionary entries in the same change, plus a type addition in
    src/lib/types/dictionary.ts. PR2's register-picker copy
    (auth.referredByLabel/auth.referredByNoneOption) satisfied this in both
    locales + dictionary.ts. PR3's carousel fallback label + banner copy
    (tripperAttribution section) also satisfied this — added to es.json,
    en.json, and a new TripperAttributionDict in dictionary.ts, parity
    verified programmatically.
  - .claude/rules/component-patterns.md — reuse existing UI primitives
    (FormField/FormSelectField); do not hand-roll form controls. PR2's
    AuthModal picker uses FormSelectField, satisfied. PR3 introduced no new
    form controls (banner toggle is a plain button, carousel reuses the
    existing TravelerTypeCard primitive).
verified_facts:
  date: 2026-08-18
  notes:
    - "No src/middleware.ts exists — Next.js 16 renamed the convention to
       src/proxy.ts, exporting proxy(req). Confirmed via glob."
    - "proxy.ts's matcher excludes /api entirely: matcher:
       [\"/((?!_next|api|favicon\\.png|.*\\..*).*)\"]. Force-attribution logic
       needs a shared helper reachable from both proxy.ts and API routes."
    - "Prisma is Node-only in this repo (@prisma/adapter-pg + raw pg.Pool) —
       not Edge-compatible. proxy.ts defaults to Edge runtime and does zero DB
       work. Authenticated attribution is sourced from a NextAuth JWT claim
       (referredByTripperSlug), not a live query."
    - "filterCarouselCards (src/lib/utils/traveler-card.ts:86-100) drops
       non-offered types with no fallback — confirmed exactly."
    - "TravelerTypesCarousel.tsx:82-86 href is unconditionally
       /experiences/by-type/${slug}, no tripper param, even for offered types
       — confirmed exactly."
    - "TripRequest.tripperId resolution (src/app/api/trip-requests/route.ts:
       394-425) is write-once and already validates isActive:true at write
       time — reused as the precedent pattern."
    - "getTripperJourneyContext (src/lib/db/tripper-queries.ts:449+) is the
       reusable resolve+validate primitive (not_found|inactive|ok), reused for
       liveness re-validation instead of new logic."
    - "AuthModal.tsx (register modal) uses plain useState + FormField, NOT
       react-hook-form — RHF exists in package.json but is used only in 2
       unrelated xsed files."
    - "No combobox/autocomplete component exists anywhere in src/components/ui/
       or src/components/app/admin/ — the register-modal tripper picker is
       net-new UI, a plain <select>."
    - "TripperPreviewBanner.tsx is a usable shape for the mode-banner precedent
       but is hardcoded Spanish-only with zero dictionary usage — a
       pre-existing i18n violation, must not be copied as-is."
    - "@db.VarChar is not used anywhere in this schema for ids — only
       @db.Text for long text. Ids are bare String. referredByTripperId
       follows that convention (design ADR-7)."
    - "src/lib/auth.ts:219-221's trigger:'update' branch did
       `return { ...token, ...clientSession }` — a blanket client-controlled
       token spread. Confirmed as a real, blocking vulnerability once an
       attribution claim was to be added to the token (design ADR-6). Fixed in
       PR1: the client-supplied referredByTripperSlug key is stripped before
       the spread and the claim is recomputed from the DB unconditionally."
    - "getPlannerContentForType (src/lib/utils/levels.ts:225-238) already
       accepts an optional overrides param — the by-type page just never
       passed one. PR3's wiring there is smaller than originally assumed."
