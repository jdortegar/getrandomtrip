resolved_decisions:
  - id: 1
    status: final
    summary: >-
      ADR-1: User.referredByTripperId onDelete: SetNull, no historical
      snapshot/ledger. If a referring tripper's account is deleted, every
      traveler they referred permanently loses that attribution with no
      surviving record; RandomTrip keeps 100% of those travelers' future
      bookings. Deliberate — confirmed by user directly, not just the
      recommended default.
  - id: 2
    status: final
    summary: >-
      Cookie TTL is 30 days (design ADR-4). Standard referral-attribution
      window; confirmed by user over session-only (too aggressive) and 90d/1y
      (stale-repricing support burden with no offsetting benefit, since the
      permanent referral is captured at signup regardless).
  - id: 3
    status: final
    summary: >-
      Browsing /trippers/[slug] itself sets pricing attribution — intended,
      not a bug requiring a stronger explicit action. The persistent banner +
      toggle is what makes this visible and reversible to the visitor, rather
      than gating attribution behind a click-through.
  - id: 4
    status: final
    summary: >-
      Cookie name is grt_tripper (design ADR-2), matching the existing
      grt_tripper_invite / grt_traveler_invite namespace — the original
      rt_tripper placeholder from the proposal brief was corrected during
      design.
  - id: 5
    status: final
    summary: >-
      Signing secret is a derived subkey (HMAC-SHA256(NEXTAUTH_SECRET,
      "grt_tripper.v1")), not a new env var and not the raw NEXTAUTH_SECRET
      reused directly (design ADR-3) — avoids Netlify env churn while keeping
      cryptographic domain separation from session JWT signing.
  - id: 6
    status: final
    summary: >-
      ADR-6 security fix (auth.ts trigger:"update" client-session-spread
      hardening) is a blocking prerequisite, sequenced before the JWT claim is
      wired anywhere else — implemented and test-covered in PR1.
  - id: 7
    status: final
    summary: >-
      Delivery is chained PRs under feature-branch-chain (not single-PR/
      size:exception like the prior admin-user-edit-page change) — explicitly
      chosen given this change touches auth.ts's token-forgery surface
      directly, judged higher-stakes than a typical single-PR change in this
      repo.
  - id: 8
    status: final
    summary: >-
      Commission rate calculation/payout logic (the original 1%/2%/3% ask)
      remains explicitly out of scope for this change — it only builds the
      attribution foundation a future commission change would consume.
open_questions_remaining: 0
revisions:
  - artifact: explore
    date: 2026-08-18
    note: >
      Explored current attribution architecture. Corrected two premises
      against real code: no src/middleware.ts (it's src/proxy.ts), and Prisma
      is Node-only/Edge-incompatible in this repo, ruling out a live DB lookup
      in the Edge proxy. Recommended JWT-claim-based authenticated attribution
      instead. Confirmed both carousel bugs, the write-once TripRequest
      precedent, and that the register modal has no RHF/combobox to reuse.
  - artifact: proposal
    date: 2026-08-18
    note: >
      Wrote the proposal folding in explore's corrections as settled facts.
      Flagged ADR-1 (onDelete behavior) for explicit user sign-off given its
      real data-integrity consequence (historical referral credit loss on
      referrer deletion) — user confirmed SetNull/no-history directly rather
      than accepting the recommendation silently.
  - artifact: spec
    date: 2026-08-18
    note: >
      Wrote delta specs across 4 capability domains (tripper-attribution new;
      tripper, tripper-price-override, auth-verification modified as ADDED
      Requirements, since none of the three existing capability specs had
      overlapping requirement text to replace). Folded in the confirmed ADR-1
      decision as a settled, non-negotiable requirement rather than an open
      question.
  - artifact: design
    date: 2026-08-18
    note: >
      Wrote design with 9 ADRs. Found and fixed a blocking security issue
      (ADR-6): the brief's plan to add an attribution claim to the NextAuth
      JWT would have been client-forgeable via the existing
      trigger:"update" branch's unfiltered clientSession spread. Corrected
      the cookie name (grt_tripper, not rt_tripper) and the signing-secret
      source (derived subkey, not a new env var or raw NEXTAUTH_SECRET) against
      real code conventions. Flagged cookie TTL and the
      browsing-sets-attribution question for explicit user confirmation
      rather than silently picking defaults — both confirmed by user.
  - artifact: tasks
    date: 2026-08-18
    note: >
      32 tasks across 3 phases/work units, explicitly sized as 3 separate PRs
      given the security-sensitive auth.ts surface (higher review-workload
      forecast risk than the prior single-PR change). Orchestrator asked the
      user to choose chained-vs-single delivery and, once chained was chosen,
      which chain strategy — feature-branch-chain was selected over
      stacked-to-main.
  - artifact: apply (PR1)
    date: 2026-08-18
    note: >
      Implemented Phase 1 (9/9 tasks) on branch
      feature/tripper-attribution-pr1-foundation-security, off tracker branch
      feature/tripper-attribution (both created off develop). Strict TDD
      throughout; the ADR-6 security fix and the JWT claim wiring were
      implemented in the same jwt() edit (no commits existed yet to sequence
      against, so the hard-ordering requirement was satisfied by construction
      rather than by separate commits — flagged for the orchestrator's commit
      strategy). Full regression suite green (203 files/1481 tests),
      typecheck clean. npm run lint remains broken repo-wide for unrelated
      pre-existing reasons (Next 16.2.6 / eslint-config-next flat-config
      issue). Mid-flight, the user asked to see the SDD documents as files;
      this state.yaml and the sibling .md files were backfilled from the 6
      engram observations that existed at that point, at the user's request
      to switch from engram-only to openspec-only artifact storage.
  - artifact: apply (PR2)
    date: 2026-08-18
    note: >
      Implemented Phase 2 (11/11 tasks) on branch
      feature/tripper-attribution-pr2-server-wiring, off PR1's branch (already
      merged into this branch's history). Strict TDD throughout — every
      mockable unit (attribution-server.ts, all three new/modified route
      handlers) had a RED test confirmed against the pre-implementation state
      before GREEN. proxy.ts and AuthModal.tsx have no dedicated unit tests,
      matching the design's own testing-strategy scoping (no middleware
      harness, no AuthModal test precedent to follow). One deliberate design
      deviation: proxy.ts applies the attribution cookie decision to i18n/canon
      redirect responses too, not only the NextResponse.next() pass-through,
      so a ?tripper= param on a redirected request doesn't need a second
      round-trip to take effect. Full regression suite green (206 files/1506
      tests, +25 vs PR1), typecheck clean. npm run lint remains broken
      repo-wide for the same pre-existing reason noted in PR1.
  - artifact: apply (PR3)
    date: 2026-08-18
    note: >
      Implemented Phase 3 (12/12 tasks, the final phase) on branch
      feature/tripper-attribution-pr3-carousel-ui, off PR2's branch (PR1+PR2
      already merged into this branch's history). filterCarouselCards
      rewritten to flag (availableFromTripper) instead of dropping
      non-offered types; TravelerTypesCarousel wired to a new pure
      resolveCarouselCardHref helper (design ADR-8's href table) plus a
      fallback description for non-offered cards; by-type and journey pages
      now resolve attribution server-side (readAttributionSlug +
      getTripperJourneyContext/resolveLiveAttribution) instead of
      JourneyPageClient's retired client-side ?tripper= fetch;
      AttributionModeBanner (server) + AttributionModeBannerToggle (client)
      created and mounted in layout.tsx via a new banner prop on
      GateAwareChrome. Mid-session copy revision: banner/toggle copy was
      changed to remove all pricing language in favor of framing the toggle
      as tripper-curated vs. RandomTrip general experiences, per direct user
      feedback during the same apply session. Strict TDD followed for the
      one new pure-logic unit (traveler-card.ts); component/page-wiring
      layers verified via full regression + typecheck per the design's own
      testing-strategy scoping, consistent with PR1/PR2's precedent. Full
      regression suite green (209 files/1538 tests, +1 file/+10 tests vs
      PR2), typecheck clean. npm run lint remains broken repo-wide for the
      same pre-existing reason noted in PR1/PR2. All 32 tasks across all 3
      phases are now complete; left uncommitted per instructions for
      orchestrator review.
  - artifact: apply (PR3 risk remediation, Phase 3b)
    date: 2026-08-19
    note: >
      Same session, post-apply: user asked to address the three risks
      flagged in the PR3 return summary and formalize them into specs/tasks
      rather than leave them as flagged-but-unfixed. (1)
      TripperTravelerTypesSection.tsx's own independent hide guard removed
      — a tripper with zero offerings now shows the fallback-card row
      instead of the whole section vanishing; new spec scenario in
      specs/tripper/spec.md + a new component test. (2) Added
      component-mount test coverage for TravelerTypesCarousel itself
      (previously only its pure helpers were unit-tested) plus 2 new tests
      on GateAwareChrome's banner prop; empirically confirmed no
      ResizeObserver/Embla mounting issues. (3) Wrapped
      getTripperJourneyContext and readAttributionSlug in React.cache() to
      dedupe same-request duplicate cookie-verify/DB reads across the
      banner and page-level attribution resolves; new
      "Cross-Cutting: Request-Scoped Attribution Reads" spec section +
      design.md ADR-10; empirically verified cache() is a safe no-op
      passthrough outside an active Next.js request render, so no existing
      test needed a mock change. tasks.md gained a new Phase 3b (3.13-3.15,
      3/3 complete). Full regression: 211 files/1547 tests green (+2
      files/+9 tests vs the post-PR3 baseline), typecheck clean. Still
      uncommitted per instructions.
